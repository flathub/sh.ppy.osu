app-id: sh.ppy.osu
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
separate-locales: false
command: start-osu
sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet10

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --device=input
  - --device-if=all:!has-input-device
  - --filesystem=xdg-music:ro
  - --filesystem=xdg-download:rw
  - --filesystem=xdg-videos:ro
  - --filesystem=xdg-pictures:ro
  - --filesystem=xdg-run/app/com.discordapp.Discord:create
  - --filesystem=xdg-run/app/com.discordapp.DiscordCanary:create
  - --filesystem=~/.wine:ro
  - --filesystem=~/.osu:ro
  - --filesystem=~/.local/share/osu-wine:ro
  - --env=DOTNET_ROOT=/app/lib/dotnet
  # https://github.com/ppy/osu/pull/19471/commits/38a8b9cf0af9e5bbd523378710ab2adbd908a36d
  # https://github.com/libsdl-org/SDL/blob/a6179e85c02bc65ff64553c046b16d2ef1a72ba9/src/power/linux/SDL_syspower.c#L542
  - --system-talk-name=org.freedesktop.UPower

modules:
  - name: dotnet
    buildsystem: simple
    build-commands:
    - /usr/lib/sdk/dotnet10/bin/install.sh

  - name: libevdev
    buildsystem: meson
    config-opts:
      - -Ddocumentation=disabled
      - -Dtests=disabled
    cleanup:
      - /include
      - /lib/pkgconfig
    sources:
      - type: archive
        url: https://www.freedesktop.org/software/libevdev/libevdev-1.14.0.tar.xz
        sha256: 5a0966c7110648665983848bad696c7acba614a2160d2865d535397101007332
        x-checker-data:
          type: html
          url: https://www.freedesktop.org/software/libevdev/
          pattern: (libevdev-(\d+\.\d+\.\d+)\.tar\.xz)

  - name: osu-lazer
    buildsystem: simple
    build-options:
      no-debuginfo: true
      prepend-path: "/usr/lib/sdk/dotnet10/bin"
      append-ld-library-path: "/usr/lib/sdk/dotnet10/lib"
      prepend-pkg-config-path: "/usr/lib/sdk/dotnet10/lib/pkgconfig"
      env:
         DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    build-commands:
      - mkdir -p /app/share/applications
      - mkdir -p /app/bin
      - mkdir osu-lazer
      - tar -xf osu-lazer.tar.gz -C osu-lazer --strip-components 1
      - dotnet publish osu-lazer/osu.Desktop/osu.Desktop.csproj -c Release --no-self-contained --source ./nuget-sources
      - cp -r osu-lazer/osu.Desktop/bin/Release/net10.0/publish/* /app/bin
    post-install:
      - install -Dm755 start-osu /app/bin
      - install -Dm644 sh.ppy.osu.desktop /app/share/applications
      - install -Dm644 sh.ppy.osu.xml /app/share/mime/packages
      # app icons
      - install -Dm644 osu-512.png /app/share/icons/hicolor/512x512/apps/sh.ppy.osu.png
      - install -Dm644 osu-256.png /app/share/icons/hicolor/256x256/apps/sh.ppy.osu.png
      - install -Dm644 osu-128.png /app/share/icons/hicolor/128x128/apps/sh.ppy.osu.png
      - install -Dm644 osu-64.png /app/share/icons/hicolor/64x64/apps/sh.ppy.osu.png
      # mimetypes
      - install -Dm644 mime-512.png /app/share/icons/hicolor/512x512/mimetypes/sh.ppy.osu.x-osu-beatmap.png
      - install -Dm644 mime-256.png /app/share/icons/hicolor/256x256/mimetypes/sh.ppy.osu.x-osu-beatmap.png
      - install -Dm644 mime-128.png /app/share/icons/hicolor/128x128/mimetypes/sh.ppy.osu.x-osu-beatmap.png
      - install -Dm644 mime-64.png /app/share/icons/hicolor/64x64/mimetypes/sh.ppy.osu.x-osu-beatmap.png
      - install -Dm644 mime-48.png /app/share/icons/hicolor/48x48/mimetypes/sh.ppy.osu.x-osu-beatmap.png
      - install -Dm644 mime-32.png /app/share/icons/hicolor/32x32/mimetypes/sh.ppy.osu.x-osu-beatmap.png
      - install -Dm644 mime-16.png /app/share/icons/hicolor/16x16/mimetypes/sh.ppy.osu.x-osu-beatmap.png
    sources:
      - type: file
        url: https://github.com/ppy/osu/archive/refs/tags/2026.1117.0-lazer.tar.gz
        sha256: d23adb1a5113aa22e949884365d92c43ea3af353cf83627956380a63f24b5c52
        dest-filename: osu-lazer.tar.gz
        x-checker-data:
          type: github
          repo: ppy/osu
          source-archive: tarball
      - ./nuget-sources.json
      - type: file
        path: icons/osu-512.png
      - type: file
        path: icons/osu-256.png
      - type: file
        path: icons/osu-128.png
      - type: file
        path: icons/osu-64.png
      - type: file
        path: icons/mime-512.png
      - type: file
        path: icons/mime-256.png
      - type: file
        path: icons/mime-128.png
      - type: file
        path: icons/mime-64.png
      - type: file
        path: icons/mime-48.png
      - type: file
        path: icons/mime-32.png
      - type: file
        path: icons/mime-16.png
      - type: file
        path: sh.ppy.osu.xml
      - type: file
        path: sh.ppy.osu.metainfo.xml
      - type: file
        path: start-osu
      - type: file
        path: sh.ppy.osu.desktop
